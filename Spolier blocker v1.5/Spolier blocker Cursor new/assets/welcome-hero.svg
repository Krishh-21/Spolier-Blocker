<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="720" viewBox="0 0 1920 720">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07121a" />
      <stop offset="1" stop-color="#0b1628" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feBlend in="SourceGraphic" in2="b" mode="normal"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>

  <!-- subtle vignette -->
  <rect width="100%" height="100%" fill="black" opacity="0.06"/>

  <!-- centered glass panel -->
  <g transform="translate(160,80)">
    <rect width="1600" height="560" rx="18" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.03)" />

    <!-- left: headline -->
    <g transform="translate(60,60)">
      <text x="0" y="0" fill="#eaf6ff" font-family="Inter,Segoe UI,Arial" font-size="48" font-weight="700">Welcome to Spoiler Shield</text>
      <text x="0" y="48" fill="#9fb4c8" font-family="Inter,Segoe UI,Arial" font-size="18">Keep spoilers blurred so you can enjoy the story.</text>

      <!-- buttons -->
      <g transform="translate(0,100)">
        <rect x="0" y="0" rx="10" width="160" height="44" fill="#6aa0ff" />
        <text x="20" y="28" fill="#071220" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Open Settings</text>

        <rect x="180" y="0" rx="10" width="140" height="44" fill="#163047" />
        <text x="210" y="28" fill="#dbeefc" font-family="Inter,Segoe UI,Arial" font-size="14" font-weight="600">Quick Toggle</text>
      </g>
    </g>

    <!-- right: illustrative card with blurred content example -->
    <g transform="translate(920,60)">
      <rect x="0" y="0" rx="12" width="560" height="360" fill="#071a24" opacity="0.9" stroke="rgba(255,255,255,0.02)" />
      <!-- mocked article with blurred spoiler area -->
      <g transform="translate(24,24)">
        <rect width="512" height="28" rx="6" fill="#0f2633" />
        <rect y="48" width="400" height="18" rx="4" fill="#102935" />
        <rect y="80" width="480" height="14" rx="4" fill="#102935" />
        <rect y="110" width="380" height="60" rx="6" fill="#0f2b38" />

        <!-- spoiler box (blurred look) -->
        <g transform="translate(0,180)">
          <rect width="480" height="44" rx="8" fill="#123042" />
          <rect x="8" y="8" width="464" height="28" rx="6" fill="#0b3142" opacity="0.5"/>
          <text x="20" y="30" fill="#9fb4c8" font-family="Inter,Segoe UI,Arial" font-size="14">Spoiler: [blurred content]</text>
        </g>
      </g>
    </g>
  </g>
</svg>
