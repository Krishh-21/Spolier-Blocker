<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https://image.tmdb.org data:; connect-src 'self' https://api.themoviedb.org https://*.vercel.app; font-src 'self'">
  <title>Spoiler Shield</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { 
      width: 380px;
      min-height: 500px;
      padding: 0;
      margin: 0;
      background: linear-gradient(135deg, #0a0e1a 0%, #131827 100%);
    }
    
    .popup-container {
      padding: 20px;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    
    .logo-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
    }
    
    .logo-icon svg {
      width: 24px;
      height: 24px;
      fill: white;
    }
    
    .logo-text h1 {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .logo-text .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin: 0;
    }
    
    .quick-actions {
      display: flex;
      gap: 8px;
    }
    
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      padding: 0;
    }
    
    .icon-btn:hover {
      background: var(--bg-tertiary);
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }
    
    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: var(--text-secondary);
    }
    
    .section-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    
    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .badge {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      color: white;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
    }
    
    .toggle-row label {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .search-box {
      margin-bottom: 12px;
    }
    
    .search-input-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    
    .search-input-group select {
      flex: 0 0 100px;
    }
    
    .search-input-group input {
      flex: 1;
    }
    
    .action-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    
    .btn-small {
      padding: 8px 12px;
      font-size: 12px;
    }
    
    #selectedList li {
      background: var(--bg-tertiary);
      padding: 10px;
      border-radius: 8px;
      margin: 6px 0;
      font-size: 12px;
      border: 1px solid var(--border);
    }
    
    .status-bar {
      padding: 12px;
      background: var(--bg-tertiary);
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
    }
    
    .site-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: var(--bg-tertiary);
      border-radius: 8px;
      font-size: 12px;
    }
    
    .site-badge {
      background: rgba(102, 126, 234, 0.2);
      color: var(--accent-primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 11px;
    }
    
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin: 0; }
    
    .sr-only { 
      position: absolute; 
      width: 1px; 
      height: 1px; 
      padding: 0; 
      margin: -1px; 
      overflow: hidden; 
      clip: rect(0,0,0,0); 
      white-space: nowrap; 
      border: 0;
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-to-main">Skip to main content</a>
  
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="logo-section" id="logoLink" style="cursor: pointer;" title="Open Spoiler Shield website">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>
        <div class="logo-text">
          <h1>Spoiler Shield</h1>
          <p class="subtitle">Stay spoiler-free</p>
        </div>
      </div>
      <div class="quick-actions">
        <button class="icon-btn" id="openOptions" aria-label="Open settings" title="Settings">
          <svg viewBox="0 0 24 24">
            <path fill="currentColor" d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
          </svg>
        </button>
      </div>
    </div>
    
    <!-- Master Toggle -->
    <div class="section-card">
      <div class="toggle-row">
        <label for="toggleEnabled">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
          Extension Active
        </label>
        <input type="checkbox" id="toggleEnabled" aria-label="Toggle extension on/off">
      </div>
    </div>
    
    <!-- Site Status -->
    <div class="section-card">
      <div class="site-status">
        <span class="subtle">Current site:</span>
        <span class="site-badge" id="siteHost" aria-live="polite">–</span>
      </div>
      <div class="toggle-row" style="padding-top: 8px;">
        <label for="siteToggle">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
          Active on this site
        </label>
        <input type="checkbox" id="siteToggle" aria-label="Enable extension on this site">
      </div>
    </div>
    
    <!-- Search Media -->
    <div class="section-card">
      <div class="section-title">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        Search Media
      </div>
      <div class="search-box">
        <div class="search-input-group">
          <label for="mediaType" class="sr-only">Media type</label>
          <select id="mediaType" aria-label="Select media type">
            <option value="movie">Movie</option>
            <option value="tv">TV Show</option>
            <option value="game">Game</option>
          </select>
          <label for="searchInput" class="sr-only">Search for title</label>
          <input type="text" id="searchInput" placeholder="Search..." aria-label="Enter title to search">
        </div>
        <button class="btn" id="searchButton" style="width: 100%; margin-top: 8px;" aria-label="Search">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          Search
        </button>
      </div>
      <div id="results" role="region" aria-label="Search results" aria-live="polite"></div>
    </div>
    
    <!-- Quick Actions -->
    <div class="section-card">
      <div class="section-title">Quick Actions</div>
      <div class="action-buttons">
        <button class="btn ghost btn-small" id="reprocessBtn" aria-label="Reprocess page for spoilers">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
          Reprocess
        </button>
        <button class="btn ghost btn-small" id="revealAllBtn" title="Reveal all blurred items" aria-label="Reveal all blurred items">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
          </svg>
          Reveal All
        </button>
        <button class="btn ghost btn-small" id="hideAllBtn" title="Hide all blurred items" aria-label="Hide all blurred items">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
          </svg>
          Hide All
        </button>
        <button class="btn ghost btn-small" id="addMissedBtn" aria-label="Add missed spoiler">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
          </svg>
          Add Spoiler
        </button>
      </div>
    </div>
    
    <!-- Selected Titles -->
    <section id="main-content" class="section-card">
      <div class="section-title">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/>
        </svg>
        Blocking Titles
      </div>
      <ul id="selectedList" aria-label="List of selected titles"></ul>
      <div style="margin-top: 12px;">
        <label for="quickKeyword" class="sr-only">Quick keyword entry</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="quickKeyword" placeholder="Add custom keyword..." aria-label="Enter keyword" aria-describedby="keyword-help">
          <button class="btn btn-small" id="addQuickKeyword" aria-label="Add keyword">Add</button>
        </div>
        <div id="keyword-help" class="sr-only">Add custom spoiler keywords for better protection.</div>
      </div>
    </section>
    
    <!-- Status Bar -->
    <div id="status" class="status-bar" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>
  
  <script src="compression-utils.js"></script>
  <script src="indexeddb-manager.js"></script>
  <script src="popup.js"></script>
</body>
</html>
