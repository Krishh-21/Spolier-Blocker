<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <rect width="100%" height="100%" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#07121a"/><stop offset="1" stop-color="#0b1628"/></linearGradient>
  </defs>
  <g transform="translate(56,56)">
    <text x="0" y="0" fill="#eaf6ff" font-family="Inter,Segoe UI,Arial" font-size="44" font-weight="700">Spoiler Shield — Blur spoilers, keep the surprise</text>
    <g transform="translate(0,64)">
      <g transform="translate(0,0)">
        <rect width="360" height="220" rx="12" fill="#0f2430" />
        <text x="24" y="36" fill="#e6eef6" font-family="Inter" font-size="18">Auto-detect spoilers</text>
        <text x="24" y="64" fill="#9fb4c8" font-family="Inter" font-size="13">Blur matching text & images</text>
      </g>

      <g transform="translate(400,0)">
        <rect width="360" height="220" rx="12" fill="#0f2430" />
        <text x="24" y="36" fill="#e6eef6" font-family="Inter" font-size="18">Custom keywords</text>
        <text x="24" y="64" fill="#9fb4c8" font-family="Inter" font-size="13">Add your own terms</text>
      </g>

      <g transform="translate(800,0)">
        <rect width="360" height="220" rx="12" fill="#0f2430" />
        <text x="24" y="36" fill="#e6eef6" font-family="Inter" font-size="18">Per-site controls</text>
        <text x="24" y="64" fill="#9fb4c8" font-family="Inter" font-size="13">Enable or disable per domain</text>
      </g>
    </g>

    <g transform="translate(0,320)">
      <rect width="1120" height="320" rx="12" fill="#071a24" opacity="0.9" />
      <image href="assets/popup-mockup.svg" x="16" y="16" width="328" height="288" />
      <image href="assets/options-mockup.svg" x="360" y="16" width="832" height="288" />
    </g>
